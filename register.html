<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Create a free JOB PATH job seeker account.">
  <title>Register | JOB PATH</title>
  <link rel="icon" type="image/svg+xml" href="assets/img/favicon.svg">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/uiverse.css">
</head>
<body data-page="register">

  <div id="site-header"></div>

  <main id="main" class="auth-wrap">
    <div class="auth-card">
      <h1 class="mb-1">Create your account</h1>
      <p class="text-secondary mb-3">Job Seeker registration. It&rsquo;s free.</p>
      <p class="small mb-4">Hiring instead? <a href="register-employer.html">Register as an Employer</a></p>

      <form class="needs-validation" novalidate data-success="Account created (demo – no server connected yet)." data-redirect="jobs.html">
        <div class="uv-field">
          <input type="text" id="rUser" placeholder=" " autocomplete="username" minlength="3" required>
          <label for="rUser">Username</label>
          <span class="invalid-msg">Username must be at least 3 characters.</span>
        </div>
        <div class="uv-field">
          <input type="email" id="rEmail" placeholder=" " autocomplete="email" required>
          <label for="rEmail">Email address</label>
          <span class="invalid-msg">Please enter a valid email.</span>
        </div>
        <div class="uv-field">
          <input type="password" id="rPassword" placeholder=" " autocomplete="new-password" minlength="8" required>
          <label for="rPassword">Password (min. 8 characters)</label>
          <button type="button" class="password-toggle" data-target="#rPassword" aria-label="Show password"><i class="bi bi-eye"></i></button>
          <span class="invalid-msg">Password must be at least 8 characters.</span>
        </div>
        <div class="uv-field">
          <input type="password" id="rConfirm" placeholder=" " autocomplete="new-password" data-match="#rPassword" required>
          <label for="rConfirm">Confirm password</label>
          <span class="invalid-msg">Passwords do not match.</span>
        </div>
        <div class="mb-4">
          <label class="uv-check small"><input type="checkbox" required><span></span>I agree to the terms and privacy policy</label>
        </div>
        <button type="submit" class="uv-btn uv-btn-block">Create account</button>
      </form>

      <p class="text-center small mt-4 mb-0">Already have an account? <a href="login.html">Log in</a></p>
    </div>
  </main>

  <div id="site-footer"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/layout.js"></script>
  <script src="assets/js/main.js"></script>
</body>
</html>
