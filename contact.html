<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Contact the JOB PATH team. Send us a message and we will get back to you.">
  <title>Contact | JOB PATH</title>
  <link rel="icon" type="image/svg+xml" href="assets/img/favicon.svg">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/uiverse.css">
</head>
<body data-page="contact">

  <div id="site-header"></div>

  <main id="main">
    <header class="page-hero">
      <div class="container">
        <h1 class="display-5">Contact us</h1>
        <p class="lead mb-0">At JobPath our end goal is seeing that you are employed.</p>
      </div>
    </header>

    <section class="auth-wrap">
      <div class="auth-card">
        <p class="text-secondary">If you have any questions, please do not hesitate to send us a message.</p>
        <form class="needs-validation" novalidate data-success="Thanks! Your message has been sent.">
          <div class="uv-field">
            <input type="text" id="cName" name="name" placeholder=" " autocomplete="name" required>
            <label for="cName">Your name</label>
            <span class="invalid-msg">Please enter your name.</span>
          </div>
          <div class="uv-field">
            <input type="email" id="cEmail" name="email" placeholder=" " autocomplete="email" required>
            <label for="cEmail">Your email</label>
            <span class="invalid-msg">Please enter a valid email address.</span>
          </div>
          <div class="uv-field">
            <input type="text" id="cSubject" name="subject" placeholder=" " required>
            <label for="cSubject">Subject</label>
            <span class="invalid-msg">Please add a subject.</span>
          </div>
          <div class="uv-field">
            <textarea id="cMessage" name="message" placeholder=" " rows="5" minlength="10" required></textarea>
            <label for="cMessage">Message</label>
            <span class="invalid-msg">Please write at least 10 characters.</span>
          </div>
          <button type="submit" class="uv-btn uv-btn-block"><i class="bi bi-send"></i>Send message</button>
        </form>
      </div>
    </section>
  </main>

  <div id="site-footer"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/layout.js"></script>
  <script src="assets/js/main.js"></script>
</body>
</html>
